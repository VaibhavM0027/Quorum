##############################################################################
# Render Blueprint for Quorum.
#
# Deploy: Render Dashboard -> New -> Blueprint -> select this repository.
#
# Render will create the Postgres database and the web service, wire
# DATABASE_URL automatically, and generate JWT_SECRET. The LiveKit and Gemini
# values are secrets, so they use `sync: false`: Render prompts for them in the
# Dashboard on the first deploy and never stores them in this file.
#
# Two things are deliberately absent:
#   PORT    - Render injects it, and the Dockerfile CMD already honours it.
#   APP_URL - src/lib/env.ts falls back to Render's built-in RENDER_EXTERNAL_URL,
#             so invite links always use the live https origin. Set APP_URL
#             explicitly only once you attach a custom domain.
#
# Resource names below are matched by name. If you already created a service or
# database by hand, either rename it to match or delete it first, otherwise the
# Blueprint creates a second copy.
##############################################################################

databases:
  - name: quorum-db
    databaseName: quorum
    user: quorum
    region: singapore
    # `free` keeps the first deploy cost-free. Render's free Postgres plans have
    # historically expired after a limited period (and are not backed up), so
    # move to a paid plan before this holds anything you care about.
    plan: free

services:
  - type: web
    name: quorum
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    # `free` instances spin down after ~15 minutes idle and take 30-60s to wake,
    # which is a poor fit for a live discussion. Switch to `0.5c-512mb` (or
    # higher) for real use.
    plan: free
    healthCheckPath: /api/health
    envVars:
      # --- provisioned automatically ---
      - key: DATABASE_URL
        fromDatabase:
          name: quorum-db
          property: connectionString

      # Rendered as a base64-encoded 256-bit value (44 chars), comfortably above
      # the 32-character minimum src/lib/env.ts enforces.
      - key: JWT_SECRET
        generateValue: true

      # --- secrets: prompted on first deploy ---
      - key: LIVEKIT_URL # wss://<project>.livekit.cloud
        sync: false
      - key: LIVEKIT_HOST # https://<project>.livekit.cloud
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # --- behaviour ---
      # Session cookies are only sent over HTTPS.
      - key: COOKIE_SECURE
        value: "1"
      # Trust x-forwarded-for so per-IP rate limiting sees the real client.
      - key: TRUST_PROXY
        value: "on"
      - key: AI_ENABLED
        value: "on"
      - key: GEMINI_FAST_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_SMART_MODEL
        value: gemini-3.6-flash
      # Participants see only their own report; use "all" to let everyone see
      # the whole room's results.
      - key: REPORT_VISIBILITY
        value: own
      # Where stored session recordings are written. The Dockerfile creates this
      # directory and gives it to the runtime user.
      - key: RECORDING_DIR
        value: data/recordings
      # Largest single recording accepted, in MB.
      - key: RECORDING_MAX_MB
        value: "200"

##############################################################################
# Session recordings live on disk, and a container filesystem is discarded on
# every deploy. To keep them, attach a persistent disk and drop the leading "#".
# Disks are not available on free instances, so this requires a paid plan above.
#
#   disk:
#     name: quorum-recordings
#     mountPath: /app/data
#     sizeGB: 5
#
# Mount the parent directory (`/app/data`), not the store itself: Render mounts
# over the path, so mounting `/app/data/recordings` would hide the directory the
# image already prepared and leave it unwritable.
##############################################################################

##############################################################################
# Optional: apply the schema on every deploy instead of running `prisma db push`
# from your laptop. Pre-deploy commands require a paid instance type, so remove
# the leading "#" only after upgrading the plan above.
#
#   preDeployCommand: npx prisma db push --skip-generate
#
# Note this uses `db push` rather than `migrate deploy` because the repository
# has no prisma/migrations directory yet. Once you baseline the schema with
# `prisma migrate diff` + `prisma migrate resolve`, switch this to:
#
#   preDeployCommand: npx prisma migrate deploy
##############################################################################
